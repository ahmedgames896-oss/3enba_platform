{% load static %}
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول والانضمام - 3enba</title>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    <style>
        /* ستايل مخصص لـ Glassmorphism مدمج لسهولة التحكم */
        .auth-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: calc(100vh - 100px);
            padding: 20px;
        }
        .glass-card {
            background: rgba(26, 16, 61, 0.45);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(26, 239, 196, 0.15);
            border-radius: 20px;
            padding: 40px;
            width: 100%;
            max-width: 420px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
            transition: all 0.3s ease;
        }
        .glass-card:hover {
            border-color: rgba(26, 239, 196, 0.3);
            box-shadow: 0 8px 32px 0 rgba(26, 239, 196, 0.1);
        }
        .auth-tabs {
            display: flex;
            justify-content: space-around;
            margin-bottom: 30px;
            border-bottom: 2px solid rgba(255, 255, 255, 0.05);
        }
        .tab-btn {
            background: none;
            border: none;
            color: #ffffffb3;
            font-family: 'Cairo', sans-serif;
            font-size: 16px;
            font-weight: 600;
            padding-bottom: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .tab-btn.active {
            color: var(--neon-color);
            border-bottom: 2px solid var(--neon-color);
        }
        .input-group {
            position: relative;
            margin-bottom: 25px;
            text-align: right;
        }
        .input-group label {
            display: block;
            margin-bottom: 8px;
            color: #ffffffb3;
            font-size: 14px;
        }
        .auth-input {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            color: #fff;
            font-family: 'Cairo', sans-serif;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }
        .auth-input:focus {
            border-color: var(--neon-color);
            background: rgba(255, 255, 255, 0.08);
            box-shadow: 0 0 10px rgba(26, 239, 196, 0.2);
        }
        .form-options {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
            margin-bottom: 25px;
            color: #ffffffb3;
        }
        .form-options a {
            color: var(--neon-color);
            text-decoration: none;
        }
        .form-options a:hover {
            text-decoration: underline;
        }
        .remember-me {
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }
        .auth-btn {
            width: 100%;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
        }
        .toggle-form-p {
            margin-top: 20px;
            font-size: 14px;
            color: #ffffffb3;
        }
        .toggle-form-p span {
            color: var(--neon-color);
            cursor: pointer;
            font-weight: 600;
        }
        .toggle-form-p span:hover {
            text-decoration: underline;
        }
        .hidden-form {
            display: none;
        }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="logo-section">
            <span class="logo-icon">🍇</span>
            <span class="logo-text">3enba</span>
        </div>
        <div class="header-actions">
            <a href="/" class="neon-button" style="padding: 6px 15px; font-size: 14px; text-decoration: none;">العودة للمتجر</a>
        </div>
    </header>

    <main class="container auth-wrapper">
        <div class="glass-card">
            <div class="auth-tabs">
                <button class="tab-btn active" id="loginTab" onclick="switchForm('login')">تسجيل الدخول</button>
                <button class="tab-btn" id="registerTab" onclick="switchForm('register')">حساب جديد</button>
            </div>

            <!-- فورم تسجيل الدخول -->
            <form id="loginForm" method="POST" action="#">
                {% csrf_token %}
                <div class="input-group">
                    <label>البريد الإلكتروني أو اسم المستخدم</label>
                    <input type="text" name="username" class="auth-input" required placeholder="name@example.com">
                </div>
                <div class="input-group">
                    <label>كلمة المرور</label>
                    <input type="password" name="password" class="auth-input" required placeholder="••••••••">
                </div>
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox" name="remember"> تذكرني
                    </label>
                    <a href="#">نسيت كلمة المرور؟</a>
                </div>
                <button type="submit" class="neon-button auth-btn">دخول الحساب</button>
                <p class="toggle-form-p">ليس لديك حساب؟ <span onclick="switchForm('register')">سجل الآن</span></p>
            </form>

            <!-- فورم إنشاء حساب جديد -->
            <form id="registerForm" method="POST" action="#" class="hidden-form">
                {% csrf_token %}
                <div class="input-group">
                    <label>اسم المستخدم (بالإنجليزي)</label>
                    <input type="text" name="reg_username" class="auth-input" required placeholder="username">
                </div>
                <div class="input-group">
                    <label>البريد الإلكتروني</label>
                    <input type="email" name="reg_email" class="auth-input" required placeholder="name@example.com">
                </div>
                <div class="input-group">
                    <label>كلمة المرور الصارمة</label>
                    <input type="password" name="reg_password" class="auth-input" required placeholder="••••••••">
                </div>
                <div class="input-group">
                    <label>كود الإحالة (إن وجد)</label>
                    <input type="text" name="referral_code" class="auth-input" placeholder="3ENBA-XXXX">
                </div>
                <button type="submit" class="neon-button auth-btn">إنشاء الحساب وتفعيل النقاط</button>
                <p class="toggle-form-p">لديك حساب بالفعل؟ <span onclick="switchForm('login')">تسجيل الدخول</span></p>
            </form>
        </div>
    </main>

    <script>
        function switchForm(type) {
            const loginForm = document.getElementById('loginForm');
            const registerForm = document.getElementById('registerForm');
            const loginTab = document.getElementById('loginTab');
            const registerTab = document.getElementById('registerTab');

            if (type === 'login') {
                loginForm.classList.remove('hidden-form');
                registerForm.classList.add('hidden-form');
                loginTab.classList.add('active');
                registerTab.classList.remove('active');
            } else {
                loginForm.classList.add('hidden-form');
                registerForm.classList.remove('hidden-form');
                loginTab.classList.remove('active');
                registerTab.classList.add('active');
            }
        }
    </script>
</body>
</html>
